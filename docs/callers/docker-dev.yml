# Dev-image workflow. Identical across the Go repos — the only thing that ever
# differed between their copies was an action patch version and a comment. A
# non-Go repo needs the two overrides noted at the bottom.

name: Docker (dev images)

# Tag-based releases are handled by the gated docker job in release.yml, so a
# v* image cannot ship without the manual smoke-test approval. This workflow
# publishes development images only: tip-of-default-branch and per-commit
# `sha-<short>`, plus PR-only sanity builds.
on:
  push:
    branches: [main, master]
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker:
    uses: Anastylosis/.github/.github/workflows/docker-publish.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      mode: dev

# A Python repo adopts this with:
#
#   with:
#     mode: dev
#     go-version-build-arg: false  # no go.mod
#     version-build-args: false    # Dockerfile declares no VERSION/COMMIT/DATE
#
# and a `paths:` filter matching its own sources. Adopting also gains it the
# SLSA attestation and Trivy scan a hand-written dev workflow tends to lack.
