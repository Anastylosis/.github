name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: Anastylosis/.github/.github/workflows/go-ci.yml@v1
    permissions:
      contents: read
      checks: write
      # Codecov uploads authenticate with an OIDC token. A reusable workflow
      # cannot grant itself more than the caller holds, so it has to be here.
      id-token: write
    secrets: inherit
    with:
      binary-name: msd
      main-package: ./cmd/msd
      # msd's site handlers parse attacker-influenced HTML and build filesystem
      # paths, so the stricter checks are worth turning on as test support
      # lands. offline-isolation is the notable one still off: it catches unit
      # tests that quietly reach a live site and pass while the handler under
      # them is broken.
      vet-integration-tag: true
      check-dockerfile-go-version: true
