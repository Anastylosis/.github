name: Python CI (reusable)

# The Python counterpart to go-ci.yml. Same shape and same conventions —
# exact-pinned actions, an informational audit rather than a gate — so a
# Python repo behaves the way the Go ones do rather than being a special case.
#
# Actions are pinned to exact versions, not moving major tags. A major tag like
# @v7 advances whenever v7.x ships, so an unrelated commit can turn CI red.
# Dependabot proposes bumps; they land deliberately.

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: '3.12'
      dev-requirements:
        description: 'Requirements file holding the test and lint tooling.'
        required: false
        type: string
        default: requirements-dev.txt
      test-command:
        description: >-
          How to run the suite. Overridable because a project that needs a
          service container or a marker filter cannot express that in a path.
        required: false
        type: string
        default: 'python -m pytest tests/ -q'
      lint:
        description: 'Run `ruff check`.'
        required: false
        type: boolean
        default: true
      audit:
        description: >-
          Run pip-audit against the runtime requirements.

          Informational, like govulncheck and Trivy on the Go side: a gate here
          turns CI red on someone else's advisory and forces dependency bumps
          on their schedule rather than on a deliberate decision.
        required: false
        type: boolean
        default: true
      audit-requirements:
        required: false
        type: string
        default: requirements.txt
      pip-audit-version:
        description: 'Pinned so a new release cannot change the output shape mid-week.'
        required: false
        type: string
        default: '2.9.0'
      coverage:
        description: >-
          Measure coverage and upload it to Codecov.

          Authentication is GitHub's OIDC token, so there is no secret to
          provision — but the calling job must grant `id-token: write`, or the
          run fails at startup before any step executes.
        required: false
        type: boolean
        default: true
      coverage-source:
        description: 'Package or directory to measure. Defaults to the whole tree.'
        required: false
        type: string
        default: '.'
      pytest-cov-version:
        description: >-
          Installed by this workflow rather than required in the repo's dev
          requirements, so turning coverage on costs a caller one input rather
          than a dependency bump.
        required: false
        type: string
        default: '7.0.0'
      offline-isolation:
        description: >-
          Re-run the suite in a network namespace with only loopback up.
          Catches a test that quietly reaches the internet and therefore passes
          while the code under it is broken. Off by default because a suite
          that legitimately needs a service container cannot use it.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Codecov authenticates via OIDC rather than a stored token.
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: ${{ inputs.dev-requirements }}

      - name: Install dev dependencies
        run: pip install -r "${{ inputs.dev-requirements }}"

      - name: Lint
        if: inputs.lint
        run: ruff check .

      - name: Install pytest-cov
        if: inputs.coverage
        run: pip install "pytest-cov==${{ inputs.pytest-cov-version }}"

      - name: Test
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
          COVER: ${{ inputs.coverage }}
          SOURCE: ${{ inputs.coverage-source }}
        run: |
          args=""
          if [ "$COVER" = "true" ]; then
            args="--cov=$SOURCE --cov-report=xml --cov-report=term"
          fi
          # Unquoted on purpose: both are command-line fragments.
          # shellcheck disable=SC2086
          $TEST_COMMAND $args

      - name: Upload coverage to Codecov
        if: inputs.coverage
        uses: codecov/codecov-action@v7.0.0
        with:
          use_oidc: true
          files: coverage.xml
          disable_search: true
          fail_ci_if_error: false

  offline:
    name: Offline test isolation
    if: inputs.offline-isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: ${{ inputs.dev-requirements }}

      - name: Install dev dependencies
        run: pip install -r "${{ inputs.dev-requirements }}"

      - name: Run the suite with no network
        # A new network namespace with only loopback up. `ip link set lo up` is
        # load-bearing: without it anything binding 127.0.0.1 fails for the
        # wrong reason and every test errors misleadingly.
        #
        # `sudo unshare` rather than `unshare -r` because Ubuntu restricts
        # unprivileged user namespaces via AppArmor; runners have passwordless
        # sudo. Dropping back to the normal user keeps the pip cache usable —
        # HOME must be passed explicitly because sudo resets it.
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: |
          sudo unshare --net sh -c "
            ip link set lo up
            exec sudo -u '$USER' env HOME='$HOME' PATH='$PATH' $TEST_COMMAND
          "

  audit:
    name: Audit dependencies
    if: inputs.audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install pip-audit
        run: pip install "pip-audit==${{ inputs.pip-audit-version }}"

      - name: Audit
        env:
          REQS: ${{ inputs.audit-requirements }}
        run: pip-audit -r "$REQS" || echo "::warning::pip-audit reported findings"
