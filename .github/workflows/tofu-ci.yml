name: OpenTofu CI (reusable)

# Formatting and validation for an OpenTofu/Terraform config.
#
# Deliberately does NOT run `plan`, and still should not: a plan needs
# credentials with admin scope and, for an encrypted state, the passphrase, to
# catch what `validate` mostly catches anyway.
#
# SCOPE NARROWED 2026-08-24. This file used to argue that plan and apply
# belong on a workstation, full stop. That is no longer the org's position —
# see tofu-apply.yml, which plans on a pull request and applies behind a
# required reviewer, because the whole point of the infra repo is that adding
# a repository to the config is what creates it.
#
# So the two are a pair, not a contradiction:
#
#   tofu-ci.yml     a config that is not the source of truth for live state.
#                   No credentials, no state, no secrets. Cheap on every push.
#   tofu-apply.yml  the repo that owns the state. Credentials, a plan on the
#                   pull request, and a gated apply.
#
# Do not add plan to this file. Call the other one.

on:
  workflow_call:
    inputs:
      working-directory:
        required: false
        type: string
        default: '.'
      tofu-version:
        description: 'Pinned like every other tool here; Dependabot proposes bumps.'
        required: false
        type: string
        default: '1.12.5'

permissions:
  contents: read

jobs:
  check:
    name: Format and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: ${{ inputs.tofu-version }}
          # The wrapper rewrites stdout to capture outputs, which mangles the
          # diff `fmt -check` prints. Nothing here reads step outputs.
          tofu_wrapper: false

      - name: Check formatting
        # -recursive so a module directory cannot drift unnoticed. The failure
        # names the file; `tofu fmt` fixes it.
        run: tofu fmt -check -recursive -diff

      - name: Initialise without a backend
        # -backend=false: validation needs the providers, not the state, and
        # CI has no business holding either the state credentials or the
        # decryption passphrase.
        run: tofu init -backend=false -input=false

      - name: Validate
        run: tofu validate -no-color
