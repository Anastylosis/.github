name: Go release (reusable)

# Factored out of the most developed of the per-repo release pipelines. The
# parts that were already prose-identical across repos — SHA256SUMS
# generation, changelog, tag-annotation callout, and the ~60 lines of
# "verifying your download" instructions — are generated here. What genuinely
# differs per project (how you install it) comes in as an input.
#
# The release body is assembled into a file and passed via body_path rather
# than inlined, so the optional Docker/AUR/package sections can be omitted
# without nesting expressions inside a YAML block scalar.

on:
  workflow_call:
    inputs:
      binary-name:
        description: >-
          Binary name. Still required for a library — it names the archive
          prefix referenced in the generated verification instructions, and is
          harmless when artifacts is false.
        required: true
        type: string
      artifacts:
        description: >-
          Build and attach platform binaries. Turn off for a library: there is
          no binary to ship, and a Go module is consumed from its git tag via
          the module proxy, never from a release asset.

          Tests still run either way, so a release is gated identically for a
          library and an application — the only difference is what gets
          attached.
        required: false
        type: boolean
        default: true
      main-package:
        required: false
        type: string
        default: '.'
      platforms:
        description: 'Space-separated GOOS/GOARCH pairs to ship.'
        required: false
        type: string
        default: 'linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64'
      apt-packages:
        description: >-
          Space-separated Debian packages installed with apt before any
          ubuntu job in this workflow builds the caller's module — the
          cross-build loop, the linux entries under native-artifacts, and
          nfpm packaging. Empty (the default) skips the step and changes
          nothing for existing callers. Same input and idiom as go-ci.yml's
          apt-packages: a Fyne/OpenGL desktop consumer needs it here too,
          because this workflow compiles the module all over again rather
          than reusing anything CI already built.
        required: false
        type: string
        default: ''
      native-artifacts:
        description: >-
          Build each platform binary on a runner native to its GOOS/GOARCH
          instead of cross-compiling all of them on ubuntu-latest.
          Cross-compiling forces CGO_ENABLED=0, so a cgo-only project (a
          Fyne/OpenGL desktop app, say) can produce nothing but a headless
          linux/amd64 binary through the default path — and even that
          fails without X11/GL headers apt-packages installs. Off by
          default: the extra runners cost more, and a pure-Go project has
          no reason to pay for them.
        required: false
        type: boolean
        default: false
      windows-gui:
        description: >-
          Append -H=windowsgui to LDFLAGS for windows builds only, in both
          the cross-build and native-artifacts paths. Suppresses the
          console window a GUI binary would otherwise flash on launch. Off
          by default: a CLI's windows binary still wants its console.
        required: false
        type: boolean
        default: false

      nfpm:
        description: >-
          Build .deb and .rpm from the repo's nfpm.yaml (linux amd64 + arm64).
        required: false
        type: boolean
        default: false
      nfpm-version:
        description: 'Pinned so a breaking nfpm bump cannot silently corrupt .deb/.rpm artifacts.'
        required: false
        type: string
        default: 'v2.46.3'

      environment-name:
        description: >-
          Environment the publish job runs in. Add required reviewers to it in
          repo settings to gate the release. The use case is a reviewer
          attesting they ran integration tests CI cannot run itself — live-site
          suites, for instance, which shared runner IP ranges get blocked from.
          Downstream jobs inherit the gate transitively via `needs`.
        required: false
        type: string
        default: 'release'
      environment-url:
        required: false
        type: string
        default: ''
      pre-release-notice:
        description: >-
          Emitted as a `::notice` at the top of the publish job, once the gate
          has been approved. The gate is a trust-me check — nothing verifies
          that the reviewer ran anything — so this is where the run log records
          what they attested to. Empty omits it.
        required: false
        type: string
        default: ''
      pre-release-checklist:
        description: >-
          Markdown checklist written to the build job's step summary, so it is
          on screen when the approver opens the run to review the deployment.
          Written in the imperative — these are instructions. The matching
          after-the-fact attestation is `pre-release-notice`.
        required: false
        type: string
        default: ''

      discussion-category:
        description: >-
          Opens a Discussion linked to the release, seeded with the body. The
          category must already exist — a name matching nothing fails the API
          call, and it does so AFTER the binaries are built and the gate is
          approved. A release whose discussion already exists cannot have it
          changed, so re-running this job on an existing tag fails here; cut a
          new patch tag instead. Empty disables it.
        required: false
        type: string
        default: ''

      install-instructions:
        description: >-
          Markdown for the "Installation" section. Project-specific — this is
          the part that genuinely differs between repos.

          The literal token {{version}} is replaced with the tag minus its `v`
          prefix. Use it for container image tags and nothing else: docker
          metadata-action's semver patterns strip the `v`, so a v1.2.3 tag
          publishes the image as 1.2.3. Archive names and `go install` both
          keep the `v`, so those want the github.ref_name expression instead.
        required: false
        type: string
        default: ''
      docker-image:
        description: >-
          Image reference (e.g. "ghcr.io/<owner>/<repo>"). When set, the body
          gains a section on verifying the image attestation. Empty omits it.
        required: false
        type: string
        default: ''

      aur:
        required: false
        type: boolean
        default: false
      aur-pkgname:
        required: false
        type: string
        default: ''
      # No defaults: the AUR maintainer identity belongs to the calling repo,
      # not to this one. Required in practice when aur: true.
      aur-commit-username:
        required: false
        type: string
        default: ''
      aur-commit-email:
        required: false
        type: string
        default: ''

      homebrew:
        description: >-
          Render the repo's packaging/homebrew/<formula>.rb template into a
          Homebrew tap. Needs HOMEBREW_TAP_SSH_KEY — a deploy key with write
          access on the tap repo. GITHUB_TOKEN cannot write to another
          repository, and a deploy key never expires, so unlike a PAT there is
          nothing to remember to rotate. Same arrangement as AUR_SSH_PRIVATE_KEY.
        required: false
        type: boolean
        default: false
      homebrew-tap:
        description: 'owner/repo of the tap, e.g. Anastylosis/homebrew-tap.'
        required: false
        type: string
        default: ''
      homebrew-formula:
        description: 'Formula name without .rb. Defaults to binary-name.'
        required: false
        type: string
        default: ''

    secrets:
      AUR_SSH_PRIVATE_KEY:
        required: false
      HOMEBREW_TAP_SSH_KEY:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Test and build binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install apt packages
        # Inputs come in as env rather than being interpolated into the
        # script body, per the Run tests step below. Covers every step in
        # this job that compiles the module: tests, the cross-build loop,
        # and nfpm packaging.
        if: inputs.apt-packages != ''
        env:
          APT_PACKAGES: ${{ inputs.apt-packages }}
        run: |
          sudo apt-get update -qq
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $APT_PACKAGES

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -race -count=1 ./...

      - name: Build binaries
        if: inputs.artifacts && !inputs.native-artifacts
        # Inputs arrive as env, not spliced into the script body — see the same
        # note in go-ci.yml's test step.
        env:
          NAME: ${{ inputs.binary-name }}
          MAIN_PACKAGE: ${{ inputs.main-package }}
          PLATFORMS: ${{ inputs.platforms }}
          WINDOWS_GUI: ${{ inputs.windows-gui }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          COMMIT="${GITHUB_SHA::8}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}"
          mkdir -p dist

          # Unquoted on purpose — PLATFORMS is a space-separated list.
          # shellcheck disable=SC2086
          for platform in $PLATFORMS; do
            GOOS="${platform%/*}"
            GOARCH="${platform#*/}"
            binary="$NAME"
            archive="${NAME}-${VERSION}-${GOOS}-${GOARCH}"
            ldflags="$LDFLAGS"
            if [ "$GOOS" = "windows" ]; then
              binary="${NAME}.exe"
              # Suppresses the console window a GUI binary would otherwise
              # flash on launch; irrelevant to every other GOOS.
              if [ "$WINDOWS_GUI" = "true" ]; then
                ldflags="${ldflags} -H=windowsgui"
              fi
            fi

            echo "Building ${GOOS}/${GOARCH}..."
            GOOS=$GOOS GOARCH=$GOARCH go build -ldflags "$ldflags" -o "dist/${binary}" "$MAIN_PACKAGE"

            cd dist
            if [ "$GOOS" = "windows" ]; then
              zip "${archive}.zip" "${binary}"
            else
              tar czf "${archive}.tar.gz" "${binary}"
            fi
            rm "${binary}"
            cd ..
          done

      - name: Build .deb and .rpm packages
        if: inputs.artifacts && inputs.nfpm
        # Still cross-compiles linux/arm64 with CGO disabled, native-artifacts
        # notwithstanding — no current caller pairs nfpm with a cgo module, so
        # that combination is left unsolved rather than half-fixed here.
        env:
          NAME: ${{ inputs.binary-name }}
          MAIN_PACKAGE: ${{ inputs.main-package }}
          NFPM_VERSION: ${{ inputs.nfpm-version }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          COMMIT="${GITHUB_SHA::8}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w -X main.version=v${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}"
          # Not guaranteed to exist: the Build binaries step that used to
          # create it is skipped under native-artifacts.
          mkdir -p dist

          go install "github.com/goreleaser/nfpm/v2/cmd/nfpm@${NFPM_VERSION}"

          for arch in amd64 arm64; do
            echo "Packaging linux/${arch}..."
            GOOS=linux GOARCH=$arch go build -ldflags "$LDFLAGS" -o "dist/${NAME}" "$MAIN_PACKAGE"
            GOARCH=$arch VERSION=$VERSION nfpm package --packager deb --target dist/
            GOARCH=$arch VERSION=$VERSION nfpm package --packager rpm --target dist/
            rm "dist/${NAME}"
          done

      - name: Upload release artifacts
        # Under native-artifacts this job's dist/ holds only what nfpm put
        # there (or nothing, if nfpm is also off) — the platform binaries
        # come from the build-native matrix jobs instead.
        if: inputs.artifacts && (!inputs.native-artifacts || inputs.nfpm)
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-binaries
          path: dist/
          retention-days: 7

      - name: Release checklist
        if: inputs.pre-release-checklist != ''
        env:
          CHECKLIST: ${{ inputs.pre-release-checklist }}
        # Two surfaces, because the approval dialog itself cannot carry text:
        # the job summary (full markdown, lower on the run page) and a notice
        # annotation, which GitHub lists at the TOP of the run page — that is
        # what the approver sees first. Annotations are single-line, so the
        # checklist is flattened to one line there; the summary keeps the
        # boxes.
        run: |
          {
            echo "## Release checklist"
            echo ""
            echo "This run is paused for approval. Confirm every item before approving."
            echo ""
            printf '%s\n' "$CHECKLIST"
          } >> "$GITHUB_STEP_SUMMARY"
          oneline=$(printf '%s' "$CHECKLIST" | sed -e 's/^[[:space:]]*- \[ \][[:space:]]*/• /' -e 's/^[[:space:]]*//' | tr -s '\n' ' ')
          echo "::notice title=Release checklist — confirm before approving::${oneline}"

  native-plan:
    name: Plan native build matrix
    if: inputs.artifacts && inputs.native-artifacts
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Map platforms to native runners
        id: plan
        # platforms is a caller-facing space-separated list (see the input
        # above); this is the only place that needs it as JSON, so it is
        # translated here rather than asking every caller to supply both
        # forms. cgo can't cross-compile, so each pair must land on a runner
        # native to that exact GOOS/GOARCH — anything else is a build that
        # would silently come out CGO_ENABLED=0.
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          entries="[]"
          # Unquoted on purpose — PLATFORMS is a space-separated list.
          # shellcheck disable=SC2086
          for platform in $PLATFORMS; do
            goos="${platform%/*}"
            goarch="${platform#*/}"
            case "${goos}/${goarch}" in
              linux/amd64)   runner="ubuntu-latest" ;;
              linux/arm64)   runner="ubuntu-24.04-arm" ;;
              darwin/amd64)  runner="macos-15-intel" ;;
              darwin/arm64)  runner="macos-latest" ;;
              windows/amd64) runner="windows-latest" ;;
              *)
                echo "::error::no native runner mapping for ${goos}/${goarch}"
                exit 1
                ;;
            esac
            entries=$(echo "$entries" | jq -c \
              --arg goos "$goos" --arg goarch "$goarch" --arg runner "$runner" \
              '. + [{goos: $goos, goarch: $goarch, runner: $runner}]')
          done
          matrix=$(jq -c -n --argjson entries "$entries" '{include: $entries}')
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  build-native:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }} (native)
    needs: native-plan
    if: inputs.artifacts && inputs.native-artifacts
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.native-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install apt packages
        # Only the linux entries have apt; darwin and windows runners don't.
        if: inputs.apt-packages != '' && matrix.goos == 'linux'
        env:
          APT_PACKAGES: ${{ inputs.apt-packages }}
        run: |
          sudo apt-get update -qq
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $APT_PACKAGES

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Build and package
        # Same archive naming, packaging convention and version stamping as
        # the cross-build loop in the build job — only the compilation is
        # native instead of GOOS/GOARCH-crossed, so cgo works.
        env:
          NAME: ${{ inputs.binary-name }}
          MAIN_PACKAGE: ${{ inputs.main-package }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          WINDOWS_GUI: ${{ inputs.windows-gui }}
        # windows-latest defaults to pwsh; this script is bash.
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          COMMIT="${GITHUB_SHA::8}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}"
          mkdir -p dist

          binary="$NAME"
          archive="${NAME}-${VERSION}-${GOOS}-${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            binary="${NAME}.exe"
            if [ "$WINDOWS_GUI" = "true" ]; then
              LDFLAGS="${LDFLAGS} -H=windowsgui"
            fi
          fi

          echo "Building ${GOOS}/${GOARCH} natively..."
          go build -ldflags "$LDFLAGS" -o "dist/${binary}" "$MAIN_PACKAGE"

          cd dist
          if [ "$GOOS" = "windows" ]; then
            # Git Bash on the windows runners ships no Info-ZIP zip; 7-Zip
            # is preinstalled and produces a standard zip.
            if command -v zip >/dev/null 2>&1; then
              zip "${archive}.zip" "${binary}"
            else
              7z a "${archive}.zip" "${binary}" >/dev/null
            fi
          else
            tar czf "${archive}.tar.gz" "${binary}"
          fi
          rm "${binary}"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          # Unique per matrix entry — upload-artifact refuses to merge into
          # an existing name from a parallel job. release downloads every
          # release-binaries* artifact and merges them into one dist/, so
          # this naming difference never reaches downstream jobs.
          name: release-binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 7

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [build, build-native]
    # native-plan/build-native are skipped outright when native-artifacts is
    # false (the default) — a skipped need otherwise cascades to skip this
    # job too, so the default "all needs succeeded" check is overridden to
    # treat build-native's skip as fine and only require build to succeed.
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      (needs.build-native.result == 'success' || needs.build-native.result == 'skipped')
    environment:
      name: ${{ inputs.environment-name }}
      url: ${{ inputs.environment-url }}
    permissions:
      # contents: write to publish the release; the rest are for
      # attest-build-provenance over the downloadable artifacts. Declared at
      # job level so this job never holds `packages: write`.
      contents: write
      discussions: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Pre-release reminder
        if: inputs.pre-release-notice != ''
        env:
          NOTICE: ${{ inputs.pre-release-notice }}
        run: echo "::notice title=Manual checks confirmed::${NOTICE}"

      - name: Download release artifacts
        if: inputs.artifacts
        # Pattern + merge covers both paths identically: the single
        # cross-build job uploads one release-binaries artifact, and
        # native-artifacts uploads one release-binaries-<goos>-<goarch> per
        # matrix entry — either way every matching artifact lands flattened
        # into dist/, exactly like the old single-name download did.
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-binaries*
          path: dist/
          merge-multiple: true

      - name: Generate SHA256SUMS
        if: inputs.artifacts
        run: |
          cd dist
          # Capture checksums into a variable BEFORE creating SHA256SUMS — bash
          # creates redirect targets before expanding globs, so `* > SHA256SUMS`
          # would otherwise hash an empty SHA256SUMS into its own listing.
          # Sort by filename so the file is stable and diffable across runs.
          sums=$(sha256sum -- *)
          echo "$sums" | LC_ALL=C sort -k2 > SHA256SUMS
          echo "Generated SHA256SUMS:"
          cat SHA256SUMS
          # Self-check: every line must verify cleanly before users get it.
          sha256sum --check --strict SHA256SUMS

      - name: Attest build provenance for the release artifacts
        if: inputs.artifacts
        # SHA256SUMS proves a download was not corrupted in transit, but it is
        # generated in this same job — anyone able to influence the build can
        # regenerate it, so it says nothing about *origin*. This binds every
        # artifact to the workflow run and commit that produced it, which is
        # the part a checksum cannot cover.
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: 'dist/*'

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --oneline --no-merges)
          else
            CHANGELOG=$(git log --oneline --no-merges "${PREV_TAG}..HEAD")
          fi
          {
            echo "changelog<<CHANGELOG_EOF"
            echo "$CHANGELOG"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Read tag annotation
        id: tagnote
        # An annotated tag's message becomes a callout at the top of the
        # release page, for saying things the commit list cannot ("maintenance
        # only, no new scrapers"). Tag with `git tag -a v1.2.3 -m "..."`; a
        # lightweight tag just omits the callout.
        run: |
          TAG="${GITHUB_REF_NAME}"
          note=""
          # A lightweight tag points straight at the commit, and %(contents:*)
          # would then return that commit's message — not a release note.
          if [ "$(git cat-file -t "$TAG" 2>/dev/null)" = "tag" ]; then
            subject=$(git for-each-ref "refs/tags/$TAG" --format='%(contents:subject)')
            # contents:subject + contents:body rather than plain contents:
            # contents includes the PGP block on a signed tag.
            body=$(git for-each-ref "refs/tags/$TAG" --format='%(contents:body)')
            if [ -n "$subject" ]; then
              note="> **${subject}**"
              if [ -n "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
                note="${note}"$'\n'">"$'\n'"$(printf '%s\n' "$body" | sed 's/^/> /' | sed 's/[[:space:]]*$//')"
              fi
            fi
          fi
          {
            echo "note<<TAGNOTE_EOF"
            echo "$note"
            echo "TAGNOTE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Assemble release body
        env:
          TAG: ${{ github.ref_name }}
          NAME: ${{ inputs.binary-name }}
          OWNER: ${{ github.repository_owner }}
          DOCKER_IMAGE: ${{ inputs.docker-image }}
          TAGNOTE: ${{ steps.tagnote.outputs.note }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
          INSTALL: ${{ inputs.install-instructions }}
          ARTIFACTS: ${{ inputs.artifacts }}
        run: |
          # Container image tags carry no `v`: docker/metadata-action's semver
          # patterns strip it, so tag v1.2.3 publishes image 1.2.3. Archive
          # names and `go install` DO keep it. Interpolating the raw tag into a
          # `docker pull` line is therefore a command that 404s — which is
          # exactly what the hand-written release notes did for a long time.
          IMAGE_TAG="${TAG#v}"

          # Callers write {{version}} where they need the stripped form.
          INSTALL="${INSTALL//\{\{version\}\}/$IMAGE_TAG}"

          {
            # Only emit the callout when the tag was annotated — an empty
            # TAGNOTE would otherwise open the release body with blank lines.
            if [ -n "$TAGNOTE" ]; then
              printf '%s\n\n' "$TAGNOTE"
            fi
            printf '## Changes\n\n%s\n\n' "$CHANGELOG"
            if [ -n "$INSTALL" ]; then
              printf '## Installation\n\n%s\n\n' "$INSTALL"
            fi

            if [ "$ARTIFACTS" = "true" ]; then
            cat <<EOF
          ## Verifying your download

          Every artifact attached to this release is hashed in **\`SHA256SUMS\`**. After downloading, verify the file you have against that line:

          **Linux / macOS** — download \`SHA256SUMS\` next to your artifact, then run:
          \`\`\`sh
          sha256sum --ignore-missing --check SHA256SUMS
          # ${NAME}-${TAG}-linux-amd64.tar.gz: OK
          \`\`\`

          On macOS, \`shasum -a 256\` works the same way (\`shasum -a 256 -c SHA256SUMS\`).

          **Windows (PowerShell)**:
          \`\`\`powershell
          # Compare the printed hash against the matching line in SHA256SUMS.
          Get-FileHash ${NAME}-${TAG}-windows-amd64.zip -Algorithm SHA256
          \`\`\`

          A mismatch — or \`FAILED\` from \`sha256sum --check\` — means the file is corrupted or tampered with; do not run it.

          ### Verifying where a binary came from

          \`SHA256SUMS\` tells you a download arrived intact. It does not tell you who built it — it is produced by the same workflow as the binaries. Every artifact here also carries a [SLSA v1 build attestation](https://slsa.dev/) binding it to the workflow run and commit that produced it.

          Requires the [\`gh\` CLI](https://cli.github.com/) v2.49+:

          \`\`\`sh
          gh attestation verify ${NAME}-${TAG}-linux-amd64.tar.gz --owner ${OWNER}
          \`\`\`

          A successful check names the workflow and the commit SHA it was built from. Anything else — including "no attestations found" — means the file did not come from this release pipeline.
          EOF
            fi

            if [ -n "$DOCKER_IMAGE" ]; then
              cat <<EOF

          ### Verifying the Docker image

          The Docker image is published with a [SLSA v1 build attestation](https://slsa.dev/) you can verify before pulling. The attestation is stored on the release workflow run, not embedded in the image index, so the manifest list stays clean.

          \`\`\`sh
          docker pull ${DOCKER_IMAGE}:${IMAGE_TAG}
          digest=\$(docker buildx imagetools inspect ${DOCKER_IMAGE}:${IMAGE_TAG} --format '{{json .Manifest}}' | jq -r '.digest')
          gh attestation verify oci://${DOCKER_IMAGE}@\$digest --owner ${OWNER}
          \`\`\`

          A successful run prints the build workflow's identity (commit SHA, repo, runner). Failure means the image wasn't built by this repo's release pipeline.
          EOF
            fi
          } > RELEASE_BODY.md

          echo "::group::Assembled release body"
          cat RELEASE_BODY.md
          echo "::endgroup::"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          # Empty for a library: dist/ does not exist, and a glob matching
          # nothing would fail the upload rather than skip it.
          files: ${{ inputs.artifacts && 'dist/*' || '' }}
          generate_release_notes: true
          discussion_category_name: ${{ inputs.discussion-category }}
          body_path: RELEASE_BODY.md

  aur:
    name: Publish to AUR
    runs-on: ubuntu-latest
    if: inputs.aur
    # Decoupled from the `release` job: a transient AUR/SSH failure used to
    # leave AUR stale because the steps lived in the release job, which is
    # one-shot and gates everything downstream. As its own job it can be re-run
    # from the Actions UI without re-cutting the GitHub release.
    needs: release
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Stamp PKGBUILD version
        # Defensive substitution: matches any prior pkgver= line so the step
        # still works if the sentinel placeholder is ever changed.
        run: sed -i "s/^pkgver=.*/pkgver=${GITHUB_REF#refs/tags/v}/" ./packaging/aur/PKGBUILD

      # AUR pushes fail transiently on the SSH side (aur.archlinux.org accepts
      # only a handful of concurrent sessions). Retry once before surfacing a
      # real failure; the job can still be re-run from the Actions UI.
      - name: Publish to AUR (attempt 1)
        id: aur1
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        continue-on-error: true
        with:
          pkgname: ${{ inputs.aur-pkgname || inputs.binary-name }}
          pkgbuild: ./packaging/aur/PKGBUILD
          commit_username: ${{ inputs.aur-commit-username }}
          commit_email: ${{ inputs.aur-commit-email }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ github.ref_name }}"
          # Run `updpkgsums` so the committed PKGBUILD ships real sha256 hashes
          # for the GitHub source tarball — replaces the SKIP placeholder.
          updpkgsums: true

      - name: Wait before retry
        if: steps.aur1.outcome == 'failure'
        run: sleep 30

      - name: Publish to AUR (attempt 2)
        if: steps.aur1.outcome == 'failure'
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: ${{ inputs.aur-pkgname || inputs.binary-name }}
          pkgbuild: ./packaging/aur/PKGBUILD
          commit_username: ${{ inputs.aur-commit-username }}
          commit_email: ${{ inputs.aur-commit-email }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ github.ref_name }}"
          updpkgsums: true

  homebrew:
    name: Publish to Homebrew tap
    runs-on: ubuntu-latest
    if: inputs.homebrew
    # Same reasoning as the aur job: decoupled from `release` so a tap push
    # that fails transiently can be re-run from the Actions UI without
    # re-cutting the GitHub release.
    needs: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Render the formula
        env:
          GH_TOKEN: ${{ github.token }}
          BINARY_NAME: ${{ inputs.binary-name }}
          FORMULA: ${{ inputs.homebrew-formula || inputs.binary-name }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"
          template="packaging/homebrew/${FORMULA}.rb"
          test -f "$template" || { echo "::error::missing $template"; exit 1; }

          # SHA256SUMS is built by the release job over the same archives the
          # formula points at, so the checksums cannot drift from the assets.
          gh release download "v${VERSION}" --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS --dir sums

          sum() {
            # $1 = archive filename; awk over "hash  name" pairs.
            awk -v f="$1" '$2 == f { print $1 }' sums/SHA256SUMS
          }

          cp "$template" formula.rb
          sed -i "s/__VERSION__/${VERSION}/g" formula.rb
          for pair in DARWIN_ARM64:darwin-arm64 DARWIN_AMD64:darwin-amd64 \
                      LINUX_ARM64:linux-arm64 LINUX_AMD64:linux-amd64; do
            key="${pair%%:*}"; plat="${pair##*:}"
            archive="${BINARY_NAME}-v${VERSION}-${plat}.tar.gz"
            h="$(sum "$archive")"
            if [ -z "$h" ]; then
              echo "::error::no checksum for ${archive} in SHA256SUMS"; exit 1
            fi
            sed -i "s/__SHA256_${key}__/${h}/g" formula.rb
          done

          # Fail loudly rather than publish a formula Homebrew cannot resolve.
          if grep -q "__[A-Z0-9_]*__" formula.rb; then
            echo "::error::unsubstituted placeholder left in the formula:"
            grep -n "__[A-Z0-9_]*__" formula.rb
            exit 1
          fi
          ruby -c formula.rb

      - name: Push to the tap
        env:
          TAP: ${{ inputs.homebrew-tap }}
          FORMULA: ${{ inputs.homebrew-formula || inputs.binary-name }}
          TAP_SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$TAP" || { echo "::error::homebrew-tap is required"; exit 1; }
          test -n "$TAP_SSH_KEY" || { echo "::error::HOMEBREW_TAP_SSH_KEY is required"; exit 1; }

          # Key material goes to a file rather than the environment: the
          # checkout below shells out to ssh, and a private key in the env of a
          # subprocess is readable from /proc on a shared runner.
          install -d -m 700 ~/.ssh
          printf '%s\n' "$TAP_SSH_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -o IdentitiesOnly=yes -i ~/.ssh/tap_key"

          git clone --depth 1 "git@github.com:${TAP}.git" tap
          mkdir -p tap/Formula
          cp formula.rb "tap/Formula/${FORMULA}.rb"

          cd tap
          # Stage first, then compare the index: `git diff --quiet` on a path
          # ignores UNTRACKED files, so the very first formula for a project
          # reported "already current" and was never pushed (FSS v1.30.1).
          git add "Formula/${FORMULA}.rb"
          if git diff --cached --quiet; then
            echo "Formula already current; nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "${FORMULA} ${GITHUB_REF#refs/tags/}"

          # One tap holds every project's formula, so two repos releasing at
          # once both clone, commit and push, and the slower one is rejected as
          # non-fast-forward. Rebase and retry: the two commits touch different
          # Formula/*.rb files, so there is nothing to conflict over. Only this
          # formula is ever staged, so a rebase cannot pick up someone else's
          # half-finished work.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt ${attempt}); rebasing on the tap"
            git pull --rebase --autostash origin HEAD || {
              echo "::error::could not rebase onto the tap"; exit 1; }
            sleep $(( attempt * 5 ))
          done
          echo "::error::could not push the formula after 3 attempts"
          exit 1
