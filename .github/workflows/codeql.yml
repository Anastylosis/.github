name: CodeQL (reusable)

# The one analysis nothing else here covers. vulncheck finds known CVEs in
# dependencies and Trivy finds them in the image; neither looks at the
# repository's own code. CodeQL does taint tracking, which is the relevant
# shape for a program that turns attacker-influenced input into SQL, file
# paths or XML.
#
# Temper expectations. CodeQL's Go query pack is considerably weaker than its
# JavaScript or Java ones, and golangci-lint (staticcheck, errcheck, bodyclose,
# errorlint) already catches much of what it would flag. It is free for public
# repositories and runs unattended, which is the argument for it.
#
# Enable it where the code parses input it does not control. On a repo that
# only talks to its own database it is mostly cost.

on:
  workflow_call:
    inputs:
      language:
        required: false
        type: string
        default: go
      build-mode:
        description: >-
          `autobuild` suits an ordinary Go module. Use `none` for a language
          that needs no build, or `manual` if autobuild cannot work out how.
        required: false
        type: string
        default: autobuild
      timeout-minutes:
        required: false
        type: number
        default: 30

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ inputs.language }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      # security-events: write is what lets results reach the Security tab.
      # Without it the run succeeds and reports nowhere.
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Go
        # Ahead of init, so autobuild uses the version go.mod declares rather
        # than whatever the runner image happens to ship.
        if: inputs.language == 'go'
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.32.1
        with:
          languages: ${{ inputs.language }}
          build-mode: ${{ inputs.build-mode }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.32.1
        with:
          category: '/language:${{ inputs.language }}'
