name: Feature request
description: Suggest something new, or a change to how something works
labels: ["enhancement"]

body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: >-
        Describe the problem, not the solution you have in mind. "I want flag
        --x" is harder to act on than "I can't tell which of two scenes was
        kept, so I re-check by hand every time".
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you'd suggest
      description: If you have a specific idea, put it here.
    validations:
      required: false

  - type: textarea
    id: workaround
    attributes:
      label: How you handle it today
      description: >-
        A workaround tells us how much this actually costs you, and sometimes
        it turns out the tool already does this and the real bug is that it
        wasn't findable.
    validations:
      required: false
