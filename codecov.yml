# Org-wide Codecov defaults.
#
# Codecov reads this file from the organisation's `.github` repository and
# applies it to every repo that has no config of its own, the same way GitHub
# treats community health files here.

codecov:
  # Every repository in this org uses `master`. Codecov otherwise guesses, and
  # it guessed `main` for Custodian — uploads landed, but the dashboard showed
  # a branch that does not exist, so the repo read as having no coverage at
  # all. The upload was never the problem.
  branch: master

coverage:
  status:
    # Informational, for the same reason vulncheck and Trivy are: a coverage
    # dip should be visible without blocking a merge. These are small projects
    # where a refactor can move the number legitimately, and a gate that cries
    # wolf gets ignored or switched off.
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  # One comment, kept updated, rather than a new one per push.
  behavior: default
  require_changes: true
